name: Build Intel (macOS 12+)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    # macos-15-intel is the LAST x86_64 (Intel) macOS image GitHub Actions offers,
    # available until Aug 2027. macos-13 (Intel) was retired 2025-12-08.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Build Kestrel (x86_64, macOS 12+)
        run: set -o pipefail; ./build.sh . 2>&1 | tee build.log

      - name: Package zip
        run: ditto -c -k --sequesterRsrc --keepParent Kestrel.app Kestrel-x86_64-macos12.zip

      - name: Verify architecture
        run: |
          echo "--- file ---"
          file Kestrel.app/Contents/MacOS/Kestrel
          echo "--- min macOS ---"
          otool -l Kestrel.app/Contents/MacOS/Kestrel | grep -A3 LC_BUILD_VERSION | head -12

      - uses: actions/upload-artifact@v4
        with:
          name: Kestrel-x86_64-macos12
          path: Kestrel-x86_64-macos12.zip

      - name: Upload build log (always, for failure diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
